[build]
  publish = "public"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22.13.0"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api-proxy/api/:splat"
  status = 200

[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api-proxy/api"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/invoice/*"
  to = "/invoice.html"
  status = 200

[[redirects]]
  from = "/web-development"
  to = "/web-development.html"
  status = 200

[[redirects]]
