<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Your project inquiry was received by Vashodiya Labs. We will follow up about next steps."
    />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#07090d" />
    <title>Thank You | Vashodiya Labs</title>
    <link rel="canonical" href="https://vashodiyalabs.netlify.app/thank-you" />
    <link rel="stylesheet" href="VashodiyaLabs.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header" id="header">
      <nav class="nav container">
        <a class="brand" href="/" aria-label="Vashodiya Labs home">
          <span class="brand-mark">VL</span>
          <span>Vashodiya<span> Labs</span></span>
        </a>
        <button
          class="menu-toggle"
          id="menuToggle"
          type="button"
          aria-label="Open navigation"
          aria-expanded="false"
          aria-controls="navLinks"
        >
          <span></span><span></span><span></span>
        </button>
        <div class="nav-links" id="navLinks">
          <a href="/">Home</a>
          <a href="/#services">Services</a>
          <a href="/#about">About</a>
          <a href="/#work">Work</a>
          <a href="/#contact">Contact</a>
          <a href="/#contact" class="nav-cta">Let's Talk <span>↗</span></a>
        </div>
      </nav>
    </header>
    <main class="container thank-you-page" id="main">
      <section class="thank-you-card">
        <div class="eyebrow"><span></span>VASHODIYA LABS</div>
        <div class="thank-you-mark" aria-hidden="true">✓</div>
        <h1 id="thankYouHeading">Thanks for stopping by.</h1>
        <p id="thankYouMessage">
          Ready to discuss a project? Tell us about it through our inquiry form.
        </p>
        <p class="reference-number" id="referenceNumber" hidden></p>
        <div class="contact-options" aria-label="Continue the conversation">
          <a
            class="contact-option"
            data-whatsapp-link
            href="#"
            target="_blank"
            rel="noopener noreferrer"
            hidden
            >Chat on WhatsApp <span>↗</span></a
          >
          <a class="contact-option" data-email-link href="#" hidden>Email us <span>↗</span></a>
          <a
            class="contact-option"
            data-booking-link
            href="#"
            target="_blank"
            rel="noopener noreferrer"
            hidden
            >Book a discovery call <span>↗</span></a
          >
        </div>
        <a class="btn btn-primary" href="/">Back to home <span>↗</span></a>
      </section>
    </main>
    <footer class="footer">
      <div class="container footer-bottom">
        <span>© <span id="year"></span> Vashodiya Labs.</span>
        <span><a href="/privacy">Privacy</a> · <a href="/terms">Terms</a></span>
      </div>
    </footer>
    <script src="config.js" defer></script>
    <script src="VashodiyaLabs.js" defer></script>
  </body>
</html>
